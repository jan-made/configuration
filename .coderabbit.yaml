# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit PR review settings. AGENTS.md and similar guideline files are read as the coding guidelines.
language: en-US
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  review_status: true
  collapse_walkthrough: true
  enable_prompt_for_ai_agents: true
  abort_on_close: true
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    ignore_usernames:
      - dependabot[bot]
  finishing_touches:
    autofix:
      enabled: true
    fix_ci:
      enabled: true
    resolve_merge_conflict:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: true
  pre_merge_checks:
    title:
      mode: warning
    description:
      mode: warning
  path_filters:
    - "!composer.lock"
    - "!vendor/**"
  path_instructions:
    - path: "src/**/*.php"
      instructions: "Nette DI configuration library (PHP 8.2+, strict types). Keep public API and DI extension options backward compatible; check readonly/typed properties and null handling."
    - path: "src/Migration.php"
      instructions: "Nextras Migrations configuration: check migration group ordering/dependencies and that dummy/test data groups are only enabled when requested."
    - path: "src/Helper/Migration/**"
      instructions: "Migration extension handlers must be safe to run repeatedly and never touch production data unintentionally."
knowledge_base:
  code_guidelines:
    enabled: true
chat:
  auto_reply: true
